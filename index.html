<div id="loginPage" class="login-page">
  <div class="login-box">
    <div class="book-icon">📚</div>

    <h1>สมุดบันทึกงาน</h1>
    <p>บันทึกงานและการบ้านที่ต้องส่ง</p>

    <div id="loginArea">
      <label>ชื่อผู้ใช้</label>
      <input id="loginUser" type="text" placeholder="ชื่อผู้ใช้">

      <label>รหัสผ่าน</label>
      <input id="loginPass" type="password" placeholder="รหัสผ่าน">

      <div id="loginError" class="error"></div>

      <button class="main-btn" onclick="login()">เข้าสู่ระบบ</button>

      <div class="switch">
        ยังไม่มีบัญชี?
        <button onclick="showRegister()">สมัครสมาชิก</button>
      </div>
    </div>

    <div id="registerArea" class="hidden">
      <label>ชื่อผู้ใช้</label>
      <input id="regUser" type="text" placeholder="ตั้งชื่อผู้ใช้">

      <label>รหัสผ่าน</label>
      <input id="regPass" type="password" placeholder="ตั้งรหัสผ่าน">

      <div id="regError" class="error"></div>

      <button class="main-btn" onclick="register()">สมัครสมาชิก</button>

      <div class="switch">
        มีบัญชีแล้ว?
        <button onclick="showLogin()">เข้าสู่ระบบ</button>
      </div>
    </div>
  </div>
</div>


<div id="mainPage" class="hidden">

  <header>
    <div class="header-left">
      <span>📚</span>
      <div>
        <h1>สมุดบันทึกงาน</h1>
        <small>Homework Note</small>
      </div>
    </div>

    <div class="header-right">
      <span id="currentUser"></span>
      <button onclick="logout()">ออกจากระบบ</button>
    </div>
  </header>


  <main>

    <div class="intro">
      <h2>งานของฉัน</h2>
      <p>บันทึกงานที่ต้องส่ง จะได้ไม่ลืม</p>
    </div>


    <div class="top-area">
      <div>
        <b id="workCount">0</b>
        <span> งานที่ยังไม่เสร็จ</span>
      </div>

      <button class="add-btn" onclick="openAdd()">
        ＋ เพิ่มงาน
      </button>
    </div>


    <div class="search-area">

      <input
        id="searchInput"
        type="text"
        placeholder="ค้นหางาน..."
        oninput="showTasks()"
      >

      <select id="subjectFilter" onchange="showTasks()">
        <option value="ทั้งหมด">ทุกวิชา</option>
        <option>คณิตศาสตร์</option>
        <option>วิทยาศาสตร์</option>
        <option>ภาษาไทย</option>
        <option>ภาษาอังกฤษ</option>
        <option>สังคมศึกษา</option>
        <option>การออกแบบและเทคโนโลยี</option>
        <option>อื่น ๆ</option>
      </select>

    </div>


    <section>
      <h3>งานที่ยังไม่เสร็จ</h3>

      <div id="taskList"></div>
    </section>


    <section class="finished-section">
      <h3>งานที่เสร็จแล้ว ✓</h3>

      <div id="finishedList"></div>
    </section>

  </main>

</div>


<div id="taskModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">เพิ่มงาน</h2>
      <button onclick="closeModal()">×</button>
    </div>

    <form id="taskForm">

      <input id="editId" type="hidden">

      <label>ชื่องาน</label>
      <input
        id="taskName"
        type="text"
        placeholder="เช่น ทำแบบฝึกหัดบทที่ 3"
        required
      >

      <label>วิชา</label>
      <select id="taskSubject" required>
        <option>คณิตศาสตร์</option>
        <option>วิทยาศาสตร์</option>
        <option>ภาษาไทย</option>
        <option>ภาษาอังกฤษ</option>
        <option>สังคมศึกษา</option>
        <option>การออกแบบและเทคโนโลยี</option>
        <option>อื่น ๆ</option>
      </select>

      <label>กำหนดส่ง</label>
      <input id="taskDate" type="date" required>

      <label>รายละเอียดเพิ่มเติม</label>
      <textarea
        id="taskDetail"
        placeholder="ถ้ามีรายละเอียดเพิ่มเติมให้ใส่ตรงนี้"
      ></textarea>

      <button class="save-btn" type="submit">
        บันทึกงาน
      </button>

    </form>

  </div>
</div>

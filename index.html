<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNote — สมุดบันทึกงาน</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- หน้าเข้าสู่ระบบ -->
  <div id="loginPage" class="login-page">
    <div class="login-box">

      <div class="book-icon">📚</div>

      <h1>สมุดบันทึกงาน</h1>
      <p>บันทึกงานและการบ้านที่ต้องส่ง</p>

      <input
        type="text"
        id="loginUser"
        placeholder="ชื่อผู้ใช้"
      >

      <input
        type="password"
        id="loginPass"
        placeholder="รหัสผ่าน"
      >

      <p id="loginError" class="error"></p>

      <button onclick="login()" class="main-btn">
        เข้าสู่ระบบ
      </button>

      <button onclick="showRegister()" class="text-btn">
        ยังไม่มีบัญชี? สมัครสมาชิก
      </button>

    </div>
  </div>


  <!-- หน้าสมัครสมาชิก -->
  <div id="registerPage" class="login-page" style="display:none;">
    <div class="login-box">

      <div class="book-icon">📝</div>

      <h1>สร้างบัญชี</h1>
      <p>เริ่มบันทึกงานของคุณ</p>

      <input
        type="text"
        id="regUser"
        placeholder="ชื่อผู้ใช้"
      >

      <input
        type="password"
        id="regPass"
        placeholder="รหัสผ่าน"
      >

      <p id="regError" class="error"></p>

      <button onclick="register()" class="main-btn">
        สมัครสมาชิก
      </button>

      <button onclick="showLogin()" class="text-btn">
        มีบัญชีแล้ว? เข้าสู่ระบบ
      </button>

    </div>
  </div>


  <!-- หน้าหลัก -->
  <div id="mainPage" style="display:none;">

    <header class="top-header">

      <div>
        <h1>📚 สมุดบันทึกงาน</h1>
        <p>Homework Note</p>
      </div>

      <div class="header-right">
        <span id="currentUser"></span>
        <button onclick="logout()" class="logout-btn">
          ออกจากระบบ
        </button>
      </div>

    </header>


    <main class="container">

      <section class="intro">

        <div>
          <h2>งานของฉัน</h2>
          <p>บันทึกงานที่ต้องส่ง จะได้ไม่ลืม</p>
        </div>

        <div class="count-box">
          <span id="workCount">0</span>
          <small>งานที่ยังไม่เสร็จ</small>
        </div>

      </section>


      <!-- ปุ่มเพิ่มงาน -->
      <div class="add-area">
        <button onclick="openAdd()" class="add-btn">
          ＋ เพิ่มงาน
        </button>
      </div>


      <!-- ค้นหา -->
      <section class="tools">

        <input
          type="text"
          id="searchInput"
          placeholder="🔍 ค้นหางาน..."
        >

        <select id="subjectFilter">
          <option value="">ทุกวิชา</option>
          <option value="คณิตศาสตร์">คณิตศาสตร์</option>
          <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
          <option value="ฟิสิกส์">ฟิสิกส์</option>
          <option value="เคมี">เคมี</option>
          <option value="ชีววิทยา">ชีววิทยา</option>
          <option value="ภาษาไทย">ภาษาไทย</option>
          <option value="ภาษาอังกฤษ">ภาษาอังกฤษ</option>
          <option value="สังคมศึกษา">สังคมศึกษา</option>
          <option value="อื่น ๆ">อื่น ๆ</option>
        </select>

      </section>


      <!-- งานที่ยังไม่เสร็จ -->
      <section class="task-section">

        <div class="section-title">
          <h2>📌 งานที่ต้องทำ</h2>
        </div>

        <div id="taskList"></div>

      </section>


      <!-- งานที่เสร็จแล้ว -->
      <section class="task-section">

        <div class="section-title">
          <h2>✓ งานที่เสร็จแล้ว</h2>
        </div>

        <div id="finishedList"></div>

      </section>

    </main>

  </div>


  <!-- หน้าต่างเพิ่ม/แก้ไขงาน -->
  <div id="taskModal" class="modal">

    <div class="modal-box">

      <div class="modal-header">
        <h2 id="modalTitle">เพิ่มงาน</h2>

        <button onclick="closeModal()" class="close-btn">
          ×
        </button>
      </div>


      <form id="taskForm">

        <input
          type="hidden"
          id="editId"
        >

        <label>ชื่องาน</label>

        <input
          type="text"
          id="taskName"
          placeholder="เช่น ทำแบบฝึกหัดบทที่ 3"
          required
        >


        <label>วิชา</label>

        <select id="taskSubject" required>
          <option value="">เลือกวิชา</option>
          <option value="คณิตศาสตร์">คณิตศาสตร์</option>
          <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
          <option value="ฟิสิกส์">ฟิสิกส์</option>
          <option value="เคมี">เคมี</option>
          <option value="ชีววิทยา">ชีววิทยา</option>
          <option value="ภาษาไทย">ภาษาไทย</option>
          <option value="ภาษาอังกฤษ">ภาษาอังกฤษ</option>
          <option value="สังคมศึกษา">สังคมศึกษา</option>
          <option value="อื่น ๆ">อื่น ๆ</option>
        </select>


        <label>กำหนดส่ง</label>

        <input
          type="date"
          id="taskDate"
          required
        >


        <label>รายละเอียดเพิ่มเติม</label>

        <textarea
          id="taskDetail"
          rows="4"
          placeholder="รายละเอียดของงาน (ถ้ามี)"
        ></textarea>


        <button type="submit" class="save-btn">
          บันทึกงาน
        </button>

      </form>

    </div>

  </div>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
